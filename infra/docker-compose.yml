services:
  db:
    image: postgres:16
    container_name: cybersecops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersecops
      POSTGRES_PASSWORD: changeme_local_dev
      POSTGRES_DB: cybersecops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cybersecops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Vulnerable lab target — ONLY scan this, never a real external host.
  juice-shop:
    image: bkimminich/juice-shop
    container_name: cyberlab-juiceshop
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:
